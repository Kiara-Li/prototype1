<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Look Up</title>
<style>
  @font-face { font-family: "TWK Everett"; src: url("../fonts/TWKEverett-Regular.otf") format("opentype"); }
  @font-face { font-family: "TWK Everett Mono"; src: url("../fonts/TWKEverettMono-Regular.otf") format("opentype"); }
  :root {
    --mono: "TWK Everett Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "TWK Everett", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ink: #1d2328; --mute: #5d6870; --frame: #c9d2d8;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e6e3; color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; display: block; }
  .hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* 全局颗粒：哑光、印刷感 */
  #grain { position: fixed; inset: -40px; pointer-events: none; z-index: 50; mix-blend-mode: multiply; }
  html.book #grain { display: none; }          /* 书：不加颗粒、不加滤镜 */

  /* dashboard：平的大色块外框，中间是照片窗口 */
  #dash { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #dash .band { position: absolute; background: var(--frame); }
  #dash .copy { position: absolute; pointer-events: auto; color: var(--ink); transition: opacity 400ms; }
  #dash h1 { font: 15px/1.3 var(--sans); margin: 0 0 18px; font-weight: normal; }
  #dash p { font: 12px/1.6 var(--mono); margin: 0; }
  #dash .mute { color: var(--mute); }
  #dash a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); cursor: pointer; font: 12px/1.6 var(--mono); }
  #dash a:hover { color: var(--mute); border-bottom-color: var(--mute); }
  #dash .links { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  #dash .circles { display: flex; flex-wrap: wrap; gap: 6px; }
  #dash .circles span { width: 20px; height: 20px; border: 1px solid var(--ink); border-radius: 50%; box-sizing: border-box;
                        font: 8px/18px var(--mono); text-align: center; color: var(--ink); }

  /* 开场的两只手 */
  .hand { position: fixed; z-index: 30; pointer-events: none; opacity: 0; transform-origin: 0 0; }

  /* 屏幕中间的一句话（校准、最后一句） */
  #line { position: fixed; left: 0; right: 0; top: 46%; z-index: 40; text-align: center; pointer-events: none;
          font: 15px/1.4 var(--sans); color: var(--ink); opacity: 0; transition: opacity 900ms; }

  /* 停顿时的问题 */
  #prompt { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 40; width: 420px; max-width: 80vw;
            display: none; font: 12px/1.6 var(--mono); color: var(--ink); }
  #prompt .q { font: 15px/1.4 var(--sans); margin-bottom: 14px; }
  #prompt input { width: 100%; box-sizing: border-box; font: 12px var(--mono); color: var(--ink); background: transparent;
                  border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 4px 0; outline: none; }
  #prompt .note { margin-top: 10px; color: var(--mute); font-size: 10px; }

  /* 手机：不要浏览器自带的缩放、滚动、长按选择；只按竖屏设计，横过来时请用户转回竖屏 */
  html.mobile, html.mobile body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                                  -webkit-touch-callout: none; }
  html.mobile canvas#scene { touch-action: none; }
  html.mobile #prompt input { -webkit-user-select: text; user-select: text; font-size: 16px; }   /* 16px：iOS 才不会自动放大 */
  #rotate { display: none; position: fixed; inset: 0; z-index: 90; background: var(--frame); color: var(--ink);
            align-items: center; justify-content: center; text-align: center; padding: 24px; font: 15px/1.4 var(--sans); }
  @media (orientation: landscape) { html.mobile #rotate { display: flex; } }
  html.mobile #debug { left: 12px; bottom: 12px; }

  #debug { position: fixed; left: 70px; bottom: 16px; z-index: 45; font: 10px/1.5 var(--mono); color: var(--ink);
           white-space: pre; pointer-events: none; display: none; }
</style>
<link rel="stylesheet" href="dashboard.css">
<script src="../config.js"></script>
<script src="config.js"></script>
<script src="content.js"></script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="dash">
  <div class="band" id="bT"></div><div class="band" id="bB"></div><div class="band" id="bL"></div><div class="band" id="bR"></div>
  <div class="copy" id="dStart">
    <h1 id="dTitle"></h1>
    <div id="dLines"></div>
    <p class="mute" id="dHow" style="margin-top:14px"></p>
    <p style="margin-top:22px"><a id="dBegin"></a></p>
    <p class="mute" id="dKeys" style="margin-top:10px;font-size:10px"></p>
  </div>
  <div class="copy" id="dEnd" style="opacity:0;pointer-events:none">
    <h1 id="eTitle"></h1>
    <div id="eLines"></div>
    <div class="links" style="margin-top:22px">
      <a id="eDownload"></a>
      <a id="ePrint"></a>
      <span class="mute" id="eTutorial" style="font:12px/1.6 var(--mono)"></span>
      <a id="eAgain" style="margin-top:12px"></a>
    </div>
  </div>
  <div class="copy" id="dCircles"><div class="circles" id="circles"></div></div>
  <div class="copy mute" id="dClear" style="font:10px/1.6 var(--mono)"></div>
</div>

<div id="dx"></div>
<img class="hand" id="handL" src="assets/hand_left.png" alt="">
<img class="hand" id="handR" src="assets/hand_right.png" alt="">
<div id="grain"></div>
<div id="line"></div>
<div id="prompt">
  <div class="q" id="pQ"></div>
  <input id="pInput" autocomplete="off" spellcheck="false">
  <div class="note" id="pNote"></div>
</div>
<div id="debug"></div>
<div id="rotate"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
