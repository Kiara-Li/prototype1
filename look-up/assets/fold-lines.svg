      <rect x="862" y="112" width="36" height="28" fill="#f4f2ec" stroke="#1d1d1b"/><text x="871" y="133">4</text>
      <rect x="112" y="362" width="36" height="28" fill="#f4f2ec" stroke="#1d1d1b"/><text x="121" y="383">5</text>
      <rect x="862" y="862" width="36" height="28" fill="#f4f2ec" stroke="#1d1d1b"/><text x="866" y="883">16</text>
