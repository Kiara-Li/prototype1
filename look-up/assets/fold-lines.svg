    <line x1="100" y1="850" x2="1100" y2="850" stroke-dasharray="10 8"/>
    <line x1="100" y1="100" x2="1100" y2="1100" stroke-dasharray="2 8"/>
  </g>
  <g font-family="Menlo, monospace" font-size="20" fill="#1d1d1b">
    <g>
      <rect x="112" y="112" width="36" height="28" fill="#f4f2ec" stroke="#1d1d1b"/><text x="121" y="133">1</text>
